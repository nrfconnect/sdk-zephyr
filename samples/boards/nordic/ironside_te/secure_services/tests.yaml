sample:
  name: IronSide TE secure services
  description: |
    Calls the IronSide TE boot report, PSA Crypto and PSA Initial Attestation
    services from a non-secure application.

tests:
  sample.boards.nordic.ironside_te.secure_services:
    tags: ironside_te
    filter: CONFIG_IRONSIDE_TE_CLIENT
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp/ite
    timeout: 10
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Booted the application, lifecycle assembly and test"
        - "Attestation token: "
        - "All IronSide TE services responded"
