common:
  sysbuild: true
  tags:
    - ipc
  harness: ztest
  timeout: 60

tests:
  tests.ipc.ipc_service_error_cases.icmsg:
    platform_allow:
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
    extra_args:
      - FILE_SUFFIX=icmsg
    extra_configs:
      - CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
      - CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_PRIORITY=-3
      - CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-3
      - CONFIG_ZTEST_THREAD_PRIORITY=10
  tests.ipc.ipc_service_error_cases.icbmsg:
    platform_allow:
      - nrf5340bsim/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
    extra_args:
      - FILE_SUFFIX=icbmsg
    extra_configs:
      - CONFIG_IPC_SERVICE_BACKEND_ICBMSG_DEINIT=y
  tests.ipc.ipc_service_error_cases.icmsg.no_multithreading:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - FILE_SUFFIX=icmsg
    extra_configs:
      - CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
      - CONFIG_MULTITHREADING=n
  tests.ipc.ipc_service_error_cases.icbmsg.no_multithreading:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - FILE_SUFFIX=icbmsg
    extra_configs:
      - CONFIG_MULTITHREADING=n
      - CONFIG_IPC_SERVICE_BACKEND_ICBMSG_DEINIT=y
